# PIPO default configuration -- full parameter reference.
#
# Every configurable parameter, with the built-in default taken from the
# dataclasses in src/common/config.py. All of them are optional: a config file
# only needs to list the keys it overrides (see config.toml for the minimal
# example, which is what src/main.py loads by default).
#
# This file is a reference, not a fallback: src/common/config.py still points
# DEFAULT_CONFIG_FILE at config.toml. Use it explicitly with
#   python -m src.main server --config config_default.toml
#   python -m src.main client --config config_default.toml --verify
#
# Command-line flags override anything set here: --host --port --device
# --model --n --seed --wfile --protocol --use-he --verify.

[common]
# Address the client dials and the server binds.
host = "127.0.0.1"
# TCP port for the client <-> server socket.
port = 8100
# Torch device for local inference, e.g. "cpu", "cuda", "cuda:0".
device = "cpu"
# Model name, resolved through models/registry.py (e.g. "poc-1", "minionn",
# plus the resnet / vgg variants).
model = "poc-1"
# Number of online inference rounds per run.
n = 1
# RNG seed for randomly initialised weights. The server and the client build
# the same model, so they must agree -- otherwise --verify compares against a
# different set of weights.
seed = 0
# Use homomorphic encryption in the offline phase. The backend is picked by
# [common.he] backend ("none" | "pyfhel") and its parameters live in
# [common.he.pyfhel] (CKKS: n, scale, qi_sizes).
use_he = false
# Run mode:
#   "offline"  - interactive generation of a resource set (see
#                [common.resource]); the server and the client each run once
#   "standard" - interactive offline phase + online phase (default);
#                generated resources are not persisted
#   "online"   - restore a precomputed resource set and skip the interactive
#                offline phase (the server picks the set via
#                [common.resource].index, or a random one, and announces it)
mode = "standard"

[common.resource]
# Root directory of the precomputed resources; one sub-directory per
# model name, one res_XXXX_server.pt + res_XXXX_client.pt pair per set.
dir = "resources"
# Resource set index. Loading (mode = online): 0 = the server picks a random
# available set and announces it to the client. Generating (mode = offline):
# 0 = the next free index after the highest existing one.
index = 0

[common.he]
# HE backend used when use_he = true: "none" | "pyfhel". "none" treats the
# offline data as plaintext end to end (identity encryption, plain float
# serialization); "pyfhel" uses the Pyfhel CKKS library.
backend = "pyfhel"

[common.he.pyfhel]
# CKKS context parameters, only read by the "pyfhel" backend.
n = 8192                  # polynomial modulus degree (2**13)
scale = 1073741824        # float -> fixed-point scale (2**30)
qi_sizes = [30, 30, 30, 30, 30]  # bits of each prime in the modulus chain
# Inference protocol variant: plaintext | scale | shuffle | pad | padshuffle |
# scaleshuffle | padscaleshuffle | noise
#   plaintext - no masking at all; correctness baseline only
#   scale     - secret sharing + multiplicative blinding (PIPO, ICDCS 2024)
#   shuffle   - masking plus a random shuffling of the feature map
#   pad       - masking plus data-dependent padding (no permutation)
#   padshuffle / scaleshuffle / padscaleshuffle - the combinations
#   noise     - masking plus Gaussian DP noise (sigma from noise_sigma below)
protocol = "scale"
# Gaussian noise sigma for the noise protocol (persisted as protocol_args in
# offline resource files).
noise_sigma = 0.0
# Path to a PyTorch state_dict of model weights; empty = registry default /
# random weights.
wfile = ""

[client]
# Compare the system result against local plaintext inference after the run.
verify = false

[server]
# No server-specific settings yet; placeholder for future options.
