# PIPO default configuration.
#
# Shared by the client and the server: `[common]` holds the settings both
# roles need, `[common.model]` selects the model and its weights,
# `[server.protocol]` selects the protocol variant. Pass a different file
# with `--config <path>`. Command-line arguments override the values here.

[common]
host = "127.0.0.1"
port = 8100
device = "cpu"            # device shared by the client and the server
n = 1                     # number of online inference rounds
use_he = false            # use HE (Pyfhel CKKS) in the offline phase

[common.model]
name = "poc-1"            # model name, resolved through models/registry.py
seed = 0                  # RNG seed for random weights (shared client + server)
wfile = ""                # explicit weights file; empty = search wfolder
wfolder = "pretrained"    # default weights dir: <wfolder>/<model_name>.pt|.pth

[server.protocol]
name = "scaleshuffle"     # plaintext | scale | shuffle | pad | padshuffle | scaleshuffle | padscaleshuffle | noise
pad_ratio = 1.0           # pad/padshuffle/padscaleshuffle: 0 = no padding, 1 = as many pads as real elements

[client]
verify = false            # compare the system result against local inference